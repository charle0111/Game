<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>極簡霓虹貪食蛇 Retro Neon Snake</title>
    <style>
        /* 
           💡 【控制顏色 - CSS 部分】
           這裡使用 CSS 變數定義了整個遊戲的配色。
           您可以直接修改底下的十六進位顏色代碼（例如 #ff007f），就能瞬間改變遊戲的主題色彩！
        */
        :root {
            --bg-color: #0d0e15;       /* 遊戲網頁的深色背景 */
            --card-bg: rgba(20, 21, 33, 0.85); /* 遊戲面板的半透明玻璃效果背景 */
            --neon-glow: #00f0ff;      /* 主題霓虹藍色（邊框與發光效果） */
            --snake-head: #00ff88;     /* 蛇頭的亮綠色 */
            --snake-body: #00cc6a;     /* 蛇身的綠色 */
            --food-color: #ff0055;     /* 食物的亮粉紅色 */
            --text-color: #ffffff;     /* 主要文字顏色 */
            --text-muted: #8f9cae;     /* 次要文字顏色 */
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            background-image: 
                radial-gradient(circle at 20% 30%, rgba(0, 240, 255, 0.07) 0%, transparent 40%),
                radial-gradient(circle at 80% 70%, rgba(255, 0, 85, 0.07) 0%, transparent 40%);
        }

        /* 遊戲主面板容器 */
        .game-container {
            background: var(--card-bg);
            border: 2px solid var(--neon-glow);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 0 25px rgba(0, 240, 255, 0.25), inset 0 0 15px rgba(0, 240, 255, 0.1);
            backdrop-filter: blur(10px);
            display: flex;
            flex-direction: column;
            align-items: center;
            max-width: 95vw;
            transition: transform 0.3s ease;
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 15px;
            text-align: center;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #fff;
            text-shadow: 0 0 10px rgba(0, 240, 255, 0.6), 0 0 20px rgba(0, 240, 255, 0.3);
        }

        /* 回首頁按鈕樣式 */
        .back-to-lobby {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: var(--text-color);
            padding: 8px 18px;
            border-radius: 30px;
            font-size: 0.9rem;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.25s ease;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .back-to-lobby:hover {
            background: rgba(0, 240, 255, 0.15);
            border-color: var(--neon-glow);
            color: var(--neon-glow);
            box-shadow: 0 0 10px rgba(0, 240, 255, 0.3);
            transform: translateX(-2px);
        }

        /* 資訊看板（分數與最高分數） */
        .scoreboard {
            display: flex;
            gap: 40px;
            margin-bottom: 20px;
            font-size: 1.2rem;
            font-weight: 600;
            letter-spacing: 1px;
        }

        /* 💡 【分數控制 - CSS 樣式】 */
        .score-box {
            background: rgba(255, 255, 255, 0.05);
            padding: 8px 20px;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .score-label {
            font-size: 0.8rem;
            color: var(--text-muted);
            text-transform: uppercase;
            margin-bottom: 4px;
        }

        .score-val {
            font-size: 1.8rem;
            font-family: monospace;
            color: var(--neon-glow);
            text-shadow: 0 0 5px rgba(0, 240, 255, 0.5);
        }

        /* 遊戲畫布 Canvas */
        #gameCanvas {
            background-color: #07080e;
            border-radius: 12px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
            outline: none;
            /* 💡 【控制顏色】畫布的邊框顏色與陰影效果 */
            border: 3px solid rgba(255, 255, 255, 0.1);
            transition: border-color 0.3s;
            max-width: 100%;
            height: auto;
        }

        /* 虛擬 D-Pad 容器 */
        .virtual-dpad {
            display: flex; /* 預設顯示，方便所有設備操作 */
            flex-direction: column;
            align-items: center;
            gap: 8px;
            margin-top: 15px;
            margin-bottom: 5px;
            user-select: none;
            -webkit-user-select: none;
        }

        .dpad-row {
            display: flex;
            align-items: center;
            gap: 28px;
        }

        /* 虛擬按鍵樣式 */
        .dpad-btn {
            width: 54px;
            height: 54px;
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid rgba(0, 240, 255, 0.3);
            border-radius: 50%;
            color: var(--neon-glow);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.15s ease;
            box-shadow: 0 0 8px rgba(0, 240, 255, 0.1);
            outline: none;
            -webkit-tap-highlight-color: transparent;
        }

        /* 按鍵被按下時的霓虹發光與縮放效果 */
        .dpad-btn:active {
            transform: scale(0.9);
            background: rgba(0, 240, 255, 0.15);
            border-color: var(--neon-glow);
            box-shadow: 0 0 15px var(--neon-glow);
            color: #fff;
        }

        .dpad-center {
            width: 50px;
            height: 50px;
            background: rgba(255, 255, 255, 0.02);
            border-radius: 50%;
            border: 1px dashed rgba(255, 255, 255, 0.1);
        }

        #gameCanvas:focus {
            border-color: var(--neon-glow);
        }

        /* 控制按鈕與提示 */
        .controls {
            margin-top: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            width: 100%;
        }

        .btn {
            background: linear-gradient(135deg, var(--neon-glow), #00a2ff);
            color: #000;
            border: none;
            padding: 12px 35px;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0, 240, 255, 0.4);
            transition: all 0.2s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 240, 255, 0.6);
        }

        .btn:active {
            transform: translateY(1px);
        }

        .instructions {
            font-size: 0.85rem;
            color: var(--text-muted);
            text-align: center;
            line-height: 1.6;
            margin-top: 8px;
        }

        /* 覆蓋於 Canvas 上的遊戲結束/開始提示畫面 */
        .overlay {
            position: absolute;
            background: rgba(13, 14, 21, 0.85);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            border-radius: 12px;
            z-index: 10;
            transition: opacity 0.3s ease;
        }

        .overlay h2 {
            font-size: 2.2rem;
            color: var(--food-color);
            text-shadow: 0 0 10px rgba(255, 0, 85, 0.5);
            margin-bottom: 15px;
        }

        .overlay p {
            font-size: 1rem;
            color: var(--text-muted);
            margin-bottom: 20px;
            text-align: center;
        }
    </style>
</head>
<body>

    <!-- 返回大廳按鈕 -->
    <a href="index.html" class="back-to-lobby">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
        返回遊戲大廳
    </a>

    <div class="game-container">
        <h1>Neon Snake</h1>
        
        <div class="scoreboard">
            <!-- 💡 【分數控制 - HTML 顯示結構】 -->
            <div class="score-box">
                <span class="score-label">Score</span>
                <span id="score" class="score-val">000</span>
            </div>
            <div class="score-box">
                <span class="score-label">Best</span>
                <span id="highScore" class="score-val">000</span>
            </div>
        </div>

        <div style="position: relative;">
            <!-- 遊戲結束/準備畫面 -->
            <div id="gameOverlay" class="overlay" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex;">
                <h2 id="overlayTitle">READY?</h2>
                <p id="overlaySub">請按下方按鈕或空白鍵開始遊戲</p>
                <button class="btn" onclick="startGame()">START GAME</button>
            </div>
            
            <!-- 💡 【控制畫布大小】
                 這裡的 width="400" height="400" 定義了 Canvas 畫布的像素大小。
                 我們將它切分成 20 格 x 20 格，每格為 20 像素。
            -->
            <canvas id="gameCanvas" width="400" height="400" tabindex="0"></canvas>
        </div>

        <!-- 虛擬 D-Pad 按鈕 (預設隱藏，觸控螢幕顯示) -->
        <div id="virtualDpad" class="virtual-dpad">
            <button class="dpad-btn up" onclick="handleDpadClick('up')">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="18 15 12 9 6 15"></polyline>
                </svg>
            </button>
            <div class="dpad-row">
                <button class="dpad-btn left" onclick="handleDpadClick('left')">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="15 18 9 12 15 6"></polyline>
                    </svg>
                </button>
                <div class="dpad-center"></div>
                <button class="dpad-btn right" onclick="handleDpadClick('right')">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="9 18 15 12 9 6"></polyline>
                    </svg>
                </button>
            </div>
            <button class="dpad-btn down" onclick="handleDpadClick('down')">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="6 9 12 15 18 9"></polyline>
                </svg>
            </button>
        </div>

        <div class="controls">
            <button id="actionBtn" class="btn" onclick="startGame()">開始遊戲</button>
            <div class="instructions">
                使用鍵盤 <b>↑ ↓ ← →</b> 或 <b>W A S D</b> 控制方向<br>
                隨時按 <b>空白鍵 (Space)</b> 可以暫停/繼續遊戲
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        const scoreEl = document.getElementById("score");
        const highScoreEl = document.getElementById("highScore");
        const overlay = document.getElementById("gameOverlay");
        const overlayTitle = document.getElementById("overlayTitle");
        const overlaySub = document.getElementById("overlaySub");
        const actionBtn = document.getElementById("actionBtn");

        // 遊戲網格參數
        const gridSize = 20; // 每一格的大小是 20 x 20 像素
        const tileCount = canvas.width / gridSize; // 網格總數 = 400 / 20 = 20 格

        // 遊戲狀態變數
        let snake = [];
        let food = { x: 0, y: 0 };
        let dx = 0; // 蛇的 X 軸移動方向 (-1 代表向左，1 代表向右)
        let dy = 0; // 蛇的 Y 軸移動方向 (-1 代表向上，1 代表向下)
        
        // 💡 【分數控制 - 變數定義】
        let score = 0;
        let highScore = localStorage.getItem("snakeHighScore") || 0;
        highScoreEl.textContent = formatScore(highScore);

        let gameInterval = null;
        let isPaused = false;
        let gameRunning = false;

        // 💡 穿牆秘技變數
        let cheatCodeSequence = [];
        const targetCheatCode = ["up", "up", "down", "down", "left", "left", "right", "right"];
        let cheatUnlocked = false;

        // 💡 【控制速度】
        // 這個變數代表蛇移動一次的間隔時間（單位為毫秒）。
        // 數值越小，蛇移動得越快，遊戲難度越高！
        // 例如：100 代表 1 秒移動 10 次，改為 60 會變得非常快，改為 150 則會變慢。
        const gameSpeed = 100;

        // 初始化鍵盤監聽事件
        document.addEventListener("keydown", handleKeyDown);

        // 虛擬 D-Pad 按鍵點擊處理
        function handleDpadClick(direction) {
            // 播放點擊音效作為操作回饋
            playAudio(300, 'sine', 0.04);

            // 💡 遊戲開始前，追蹤秘技輸入
            if (!gameRunning) {
                trackCheatCode(direction);
                return;
            }

            if (isPaused) return;

            const goingUp = dy === -1;
            const goingDown = dy === 1;
            const goingRight = dx === 1;
            const goingLeft = dx === -1;

            if (direction === 'left' && !goingRight) {
                dx = -1;
                dy = 0;
            }
            if (direction === 'right' && !goingLeft) {
                dx = 1;
                dy = 0;
            }
            if (direction === 'up' && !goingDown) {
                dx = 0;
                dy = -1;
            }
            if (direction === 'down' && !goingUp) {
                dx = 0;
                dy = 1;
            }
        }

        // 💡 追蹤與判定秘技輸入
        function trackCheatCode(inputDir) {
            if (gameRunning) return; // 只有在遊戲開始前有效
            
            cheatCodeSequence.push(inputDir);
            if (cheatCodeSequence.length > targetCheatCode.length) {
                cheatCodeSequence.shift();
            }
            
            // 檢查匹配
            const isMatch = cheatCodeSequence.length === targetCheatCode.length &&
                            cheatCodeSequence.every((val, idx) => val === targetCheatCode[idx]);
            
            if (isMatch) {
                cheatUnlocked = !cheatUnlocked; // 切換解鎖狀態
                cheatCodeSequence = []; // 清空避免重複觸發
                
                // 播放超酷的 8-bit 和弦聲
                playCheatUnlockedSound();
                // 彈出精美發光的霓虹提示
                showCheatToast();
            }
        }

        // 播放秘技啟用/關閉的復古電子音效
        function playCheatUnlockedSound() {
            try {
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                
                // 如果解鎖，播放上升和弦；如果關閉，播放下降和弦
                const notes = cheatUnlocked ? [523.25, 659.25, 783.99, 1046.50] : [1046.50, 783.99, 659.25, 523.25];
                
                notes.forEach((freq, index) => {
                    setTimeout(() => {
                        const osc = audioCtx.createOscillator();
                        const gain = audioCtx.createGain();
                        
                        osc.type = 'triangle';
                        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
                        
                        gain.gain.setValueAtTime(0.12, audioCtx.currentTime);
                        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.35);
                        
                        osc.connect(gain);
                        gain.connect(audioCtx.destination);
                        
                        osc.start();
                        osc.stop(audioCtx.currentTime + 0.35);
                    }, index * 80);
                });
            } catch (e) {}
        }

        // 在畫面上彈出極具未來感的霓虹 Toast 提示
        function showCheatToast() {
            const container = document.querySelector(".game-container");
            let toast = document.getElementById("cheatToast");
            if (!toast) {
                toast = document.createElement("div");
                toast.id = "cheatToast";
                toast.style.position = "absolute";
                toast.style.top = "90px";
                toast.style.padding = "10px 22px";
                toast.style.borderRadius = "30px";
                toast.style.fontWeight = "bold";
                toast.style.fontSize = "0.95rem";
                toast.style.zIndex = "100";
                toast.style.transition = "all 0.35s cubic-bezier(0.25, 0.8, 0.25, 1)";
                toast.style.opacity = "0";
                toast.style.transform = "translateY(-15px) scale(0.95)";
                container.style.position = "relative";
                container.appendChild(toast);
            }
            
            toast.textContent = cheatUnlocked ? "🔓 穿牆秘技已啟用！" : "🔒 穿牆秘技已關閉！";
            toast.style.color = "#05060a";
            toast.style.background = cheatUnlocked ? "linear-gradient(135deg, #00ff88, #00b358)" : "linear-gradient(135deg, #ff0055, #b3003b)";
            toast.style.boxShadow = cheatUnlocked ? "0 0 20px rgba(0, 255, 136, 0.7)" : "0 0 20px rgba(255, 0, 85, 0.7)";
            
            // 觸發顯示動畫
            setTimeout(() => {
                toast.style.opacity = "1";
                toast.style.transform = "translateY(0) scale(1)";
            }, 50);
            
            // 3 秒後自動淡出隱藏
            setTimeout(() => {
                toast.style.opacity = "0";
                toast.style.transform = "translateY(-15px) scale(0.95)";
            }, 3000);
        }

        // 觸控滑動手勢偵測
        let touchStartX = 0;
        let touchStartY = 0;

        canvas.addEventListener("touchstart", function(e) {
            if (!gameRunning || isPaused) return;
            e.preventDefault(); // 阻止網頁滾動
            const touch = e.touches[0];
            touchStartX = touch.clientX;
            touchStartY = touch.clientY;
        }, { passive: false });

        canvas.addEventListener("touchmove", function(e) {
            if (!gameRunning || isPaused) return;
            e.preventDefault(); // 阻止網頁滾動
        }, { passive: false });

        canvas.addEventListener("touchend", function(e) {
            if (!gameRunning || isPaused) return;
            
            const touch = e.changedTouches[0];
            const deltaX = touch.clientX - touchStartX;
            const deltaY = touch.clientY - touchStartY;
            
            // 判定最小划動距離為 30px
            const threshold = 30;
            
            if (Math.abs(deltaX) > Math.abs(deltaY)) {
                // 水平划動
                if (Math.abs(deltaX) > threshold) {
                    if (deltaX > 0) {
                        handleDpadClick('right');
                    } else {
                        handleDpadClick('left');
                    }
                }
            } else {
                // 垂直划動
                if (Math.abs(deltaY) > threshold) {
                    if (deltaY > 0) {
                        handleDpadClick('down');
                    } else {
                        handleDpadClick('up');
                    }
                }
            }
        });

        // 行動端觸控設備檢測與優化
        if ('ontouchstart' in window || navigator.maxTouchPoints > 0) {
            // 顯示虛擬 D-pad
            const dpadEl = document.getElementById("virtualDpad");
            if (dpadEl) {
                dpadEl.style.display = "flex";
            }
            
            // 更新指示文字
            const instructionsEl = document.querySelector(".instructions");
            if (instructionsEl) {
                instructionsEl.innerHTML = "使用 <b>虛擬方向鍵</b> 或在 <b>畫面上滑動</b> 控制方向<br>點擊下方按鈕或大廳按鈕操作";
            }
        }

        // 格式化分數顯示（補零，例如 008, 090）
        function formatScore(num) {
            return String(num).padStart(3, '0');
        }

        // 💡 【控制顏色 - JavaScript 繪製部分】
        // 這裡讀取 CSS 中定義的變數，確保繪圖與 CSS 顏色完美統一
        const colors = {
            snakeHead: getComputedStyle(document.documentElement).getPropertyValue('--snake-head').trim(),
            snakeBody: getComputedStyle(document.documentElement).getPropertyValue('--snake-body').trim(),
            food: getComputedStyle(document.documentElement).getPropertyValue('--food-color').trim()
        };

        // 準備/重新開始遊戲
        function resetGame() {
            // 蛇的初始位置在正中央，初始長度為 3 節
            snake = [
                { x: 10, y: 10 },
                { x: 10, y: 11 },
                { x: 10, y: 12 }
            ];
            // 初始移動方向為向上
            dx = 0;
            dy = -1;
            
            // 💡 【分數控制 - 重設分數】
            score = 0;
            scoreEl.textContent = formatScore(score);
            
            generateFood();
            isPaused = false;
            gameRunning = true;
        }

        // 開始遊戲
        function startGame() {
            if (!gameRunning) {
                resetGame();
                overlay.style.display = "none";
                actionBtn.textContent = "暫停遊戲";
                
                // 💡 【控制速度 - 遊戲循環啟動】
                // 使用 setInterval 依照指定的 gameSpeed 時間間隔，重複執行主遊戲迴圈 (gameLoop)
                if (gameInterval) clearInterval(gameInterval);
                gameInterval = setInterval(gameLoop, gameSpeed);
            } else {
                togglePause();
            }
            // 讓 canvas 獲得焦點，以便立即可以進行鍵盤操作
            canvas.focus();
        }

        // 暫停 / 繼續遊戲
        function togglePause() {
            if (!gameRunning) return;

            if (isPaused) {
                // 繼續遊戲
                gameInterval = setInterval(gameLoop, gameSpeed);
                overlay.style.display = "none";
                actionBtn.textContent = "暫停遊戲";
                isPaused = false;
            } else {
                // 暫停遊戲
                clearInterval(gameInterval);
                overlayTitle.textContent = "PAUSED";
                overlaySub.textContent = "按空白鍵或下方按鈕繼續遊戲";
                overlay.style.display = "flex";
                actionBtn.textContent = "繼續遊戲";
                isPaused = true;
            }
        }

        // 遊戲結束
        function gameOver() {
            gameRunning = false;
            clearInterval(gameInterval);
            playAudio(120, 'sawtooth', 0.5); // 播放低沉音效表示結束
            
            // 💡 【分數控制 - 更新最高分數】
            if (score > highScore) {
                highScore = score;
                localStorage.setItem("snakeHighScore", highScore);
                highScoreEl.textContent = formatScore(highScore);
            }

            overlayTitle.textContent = "GAME OVER";
            overlaySub.textContent = `得分: ${score} 分。按下方按鈕重新開始！`;
            overlay.style.display = "flex";
            actionBtn.textContent = "重新開始";
        }

        // 隨機生成食物位置（不能跟蛇的身軀重疊）
        function generateFood() {
            while (true) {
                food.x = Math.floor(Math.random() * tileCount);
                food.y = Math.floor(Math.random() * tileCount);
                
                // 檢查是否生成在蛇身上
                let onSnake = snake.some(segment => segment.x === food.x && segment.y === food.y);
                if (!onSnake) break;
            }
        }

        // 鍵盤輸入事件處理
        function handleKeyDown(event) {
            const key = event.key;
            
            // 按空白鍵暫停/開始
            if (key === " ") {
                event.preventDefault(); // 阻擋網頁滾動
                if (!gameRunning) {
                    startGame();
                } else {
                    togglePause();
                }
                return;
            }

            // 💡 遊戲開始前，追蹤秘技輸入
            if (!gameRunning) {
                if (key === "ArrowUp" || key === "w" || key === "W") trackCheatCode("up");
                else if (key === "ArrowDown" || key === "s" || key === "S") trackCheatCode("down");
                else if (key === "ArrowLeft" || key === "a" || key === "A") trackCheatCode("left");
                else if (key === "ArrowRight" || key === "d" || key === "D") trackCheatCode("right");
            }

            if (!gameRunning || isPaused) return;

            // 💡 【方向控制】
            // 蛇不能直接反向移動（例如：正在往右走時，不能直接按左鍵往左折返）
            const goingUp = dy === -1;
            const goingDown = dy === 1;
            const goingRight = dx === 1;
            const goingLeft = dx === -1;

            if ((key === "ArrowLeft" || key === "a" || key === "A") && !goingRight) {
                dx = -1;
                dy = 0;
            }
            if ((key === "ArrowRight" || key === "d" || key === "D") && !goingLeft) {
                dx = 1;
                dy = 0;
            }
            if ((key === "ArrowUp" || key === "w" || key === "W") && !goingDown) {
                dx = 0;
                dy = -1;
            }
            if ((key === "ArrowDown" || key === "s" || key === "S") && !goingUp) {
                dx = 0;
                dy = 1;
            }
        }

        // 💡 【遊戲主迴圈】
        // 每次執行這個函式，代表蛇往前跨出一步（一個影格）
        function gameLoop() {
            moveSnake();
            
            // 檢查是否碰撞邊界或自身
            if (checkCollision()) {
                gameOver();
                return;
            }

            // 檢查是否吃到食物
            checkFoodEating();

            // 重新繪製整個畫面
            drawGame();
        }

        // 移動蛇的身軀
        function moveSnake() {
            // 根據方向計算出新的蛇頭位置
            let nextX = snake[0].x + dx;
            let nextY = snake[0].y + dy;

            // 💡 如果啟用穿牆秘技，遇到邊界時進行穿透包裹
            if (cheatUnlocked) {
                if (nextX < 0) nextX = tileCount - 1;
                else if (nextX >= tileCount) nextX = 0;
                
                if (nextY < 0) nextY = tileCount - 1;
                else if (nextY >= tileCount) nextY = 0;
            }

            const head = { x: nextX, y: nextY };
            // 將新的蛇頭加到最前面
            snake.unshift(head);
            // 預設將蛇尾刪除（保持蛇的原有長度）
            snake.pop();
        }

        // 檢查是否吃到食物
        function checkFoodEating() {
            const head = snake[0];
            
            if (head.x === food.x && head.y === food.y) {
                // 💡 【分數控制 - 吃到食物加分】
                // 每次吃到食物加 10 分
                score += 10;
                scoreEl.textContent = formatScore(score);
                
                // 播放清脆的「吃食物」電子音效
                playAudio(520, 'sine', 0.08); 

                // 複製最後一節蛇尾補回去，這樣蛇的長度就會增加一格
                const tail = snake[snake.length - 1];
                snake.push({ x: tail.x, y: tail.y });

                // 生成新的食物
                generateFood();
            }
        }

        // 碰撞偵測
        function checkCollision() {
            const head = snake[0];

            // 1. 撞到四面牆壁 (若啟用穿牆秘技，則忽略碰撞)
            if (!cheatUnlocked) {
                if (head.x < 0 || head.x >= tileCount || head.y < 0 || head.y >= tileCount) {
                    return true;
                }
            }

            // 2. 撞到自己的身體（從第 1 節身體開始比對，跳過第 0 節的頭部）
            for (let i = 1; i < snake.length; i++) {
                if (head.x === snake[i].x && head.y === snake[i].y) {
                    return true;
                }
            }

            return false;
        }

        // 💡 【控制顏色與畫布繪製 - 繪圖主函式】
        function drawGame() {
            // 清空畫布並填滿背景色
            ctx.fillStyle = "#07080e";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // 繪製格線（營造復古科技感）
            ctx.strokeStyle = "rgba(255, 255, 255, 0.02)";
            ctx.lineWidth = 1;
            for (let i = 0; i <= tileCount; i++) {
                ctx.beginPath();
                ctx.moveTo(i * gridSize, 0);
                ctx.lineTo(i * gridSize, canvas.height);
                ctx.stroke();

                ctx.beginPath();
                ctx.moveTo(0, i * gridSize);
                ctx.lineTo(canvas.width, i * gridSize);
                ctx.stroke();
            }

            // 繪製蛇
            snake.forEach((segment, index) => {
                const isHead = index === 0;
                
                // 💡 【控制顏色】這裡決定了蛇頭與蛇身的色彩
                // 蛇頭使用亮綠色 (colors.snakeHead), 蛇身使用稍暗的綠色 (colors.snakeBody)
                ctx.fillStyle = isHead ? colors.snakeHead : colors.snakeBody;
                
                // 加上發光濾鏡效果
                ctx.shadowBlur = isHead ? 12 : 4;
                ctx.shadowColor = isHead ? colors.snakeHead : colors.snakeBody;

                // 畫出圓角網格方塊
                const radius = isHead ? 6 : 4; // 蛇頭圓角較大，身體較小
                drawRoundedRect(
                    segment.x * gridSize + 1, 
                    segment.y * gridSize + 1, 
                    gridSize - 2, 
                    gridSize - 2, 
                    radius
                );
            });

            // 💡 【控制顏色】繪製食物
            // 食物使用亮粉紅色 (colors.food) 且有較強的霓虹發光感
            ctx.fillStyle = colors.food;
            ctx.shadowBlur = 15;
            ctx.shadowColor = colors.food;
            
            // 繪製圓形食物
            ctx.beginPath();
            const radius = (gridSize - 2) / 2;
            const centerX = food.x * gridSize + gridSize / 2;
            const centerY = food.y * gridSize + gridSize / 2;
            ctx.arc(centerX, centerY, radius - 1, 0, Math.PI * 2);
            ctx.fill();

            // 重設陰影效果，避免影響其他元件的渲染
            ctx.shadowBlur = 0;
        }

        // 輔助函式：繪製圓角矩形
        function drawRoundedRect(x, y, width, height, radius) {
            ctx.beginPath();
            ctx.moveTo(x + radius, y);
            ctx.lineTo(x + width - radius, y);
            ctx.quadraticCurveTo(x + width, y, x + width, y + radius);
            ctx.lineTo(x + width, y + height - radius);
            ctx.quadraticCurveTo(x + width, y + height, x + width - radius, y + height);
            ctx.lineTo(x + radius, y + height);
            ctx.quadraticCurveTo(x, y + height, x, y + height - radius);
            ctx.lineTo(x, y + radius);
            ctx.quadraticCurveTo(x, y, x + radius, y);
            ctx.closePath();
            ctx.fill();
        }

        // 💡 【音效控制器 - 瀏覽器內建 Web Audio API】
        // 無須載入任何外部音效檔，利用瀏覽器合成器即時發出清脆的電子音效
        function playAudio(frequency, type, duration) {
            try {
                // 建立音訊上下文
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                
                // 建立振盪器（發聲器）與增益節點（控制音量）
                const oscillator = audioCtx.createOscillator();
                const gainNode = audioCtx.createGain();

                oscillator.type = type; // 可選類型：'sine' (正弦波, 清脆), 'sawtooth' (鋸齒波, 低沉)
                
                // 設定頻率
                if (type === 'sawtooth') {
                    // 遊戲結束：頻率在時間內快速滑落，製造跌倒的感覺
                    oscillator.frequency.setValueAtTime(frequency, audioCtx.currentTime);
                    oscillator.frequency.exponentialRampToValueAtTime(40, audioCtx.currentTime + duration);
                } else {
                    // 吃到食物：設定固定高音
                    oscillator.frequency.setValueAtTime(frequency, audioCtx.currentTime);
                }

                // 音量包絡線：音量快速淡出，避免發出刺耳爆音
                gainNode.gain.setValueAtTime(0.15, audioCtx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);

                oscillator.connect(gainNode);
                gainNode.connect(audioCtx.destination);

                oscillator.start();
                oscillator.stop(audioCtx.currentTime + duration);
            } catch (e) {
                // 如果瀏覽器限制或不支援 AudioContext，則靜音忽略
            }
        }
    </script>
</body>
